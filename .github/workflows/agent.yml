name: agent
on:
  push:
    paths:
      - 'run/**'
  workflow_dispatch:
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: relay
        run: node tools/relay.mjs
