name: agent
on:
  push:
    paths:
      - 'run/**'
  workflow_dispatch:
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: cd tools && (npm install --silent --no-fund --no-audit @solana/web3.js@1.98.4 bs58 || true)
      - name: task
        env:
          MAKEFUN_KEYPAIR_SOLANA: ${{ secrets.MAKEFUN_KEYPAIR_SOLANA }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          RETURN_PUB_PATH: tools/return_pub.pem
        run: |
          set +e
          TASK="$(cat run/task.txt 2>/dev/null || echo connect)"
          echo "task: $TASK"
          cd tools
          node "../tools/$TASK"
          echo "exit: $?"
